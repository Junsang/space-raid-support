<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Space Raid · Space Raid</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #070b18; color: #eaf4ff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% -10%, #1b3f68 0, #0d1930 34rem, #070b18 70rem); }
      main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0 96px; }
      header, section { border: 1px solid #294b70; background: rgba(12, 26, 49, .88); box-shadow: 0 18px 45px rgba(0, 0, 0, .24); }
      header { padding: 30px; border-radius: 24px; margin-bottom: 18px; }
      section { padding: 26px 30px; border-radius: 18px; margin: 14px 0; }
      .eyebrow { margin: 0 0 10px; color: #70dcff; font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1; }
      h2 { margin: 0 0 10px; color: #9cecff; font-size: 1.15rem; }
      p, li { color: #c9d9ec; line-height: 1.65; }
      p:last-child { margin-bottom: 0; }
      a { color: #77e5ff; }
      .meta { color: #91a9c3; font-size: .92rem; }
      nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
      nav a { padding: 10px 14px; border-radius: 999px; background: #15385b; text-decoration: none; font-weight: 700; }
      footer { padding-top: 28px; color: #7189a4; font-size: .82rem; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Trace Protocol</p>
        <h1>Space Raid</h1>
        <nav>
          <a href="https://junsang.github.io/space-raid-support/support">Support</a>
          <a href="https://junsang.github.io/space-raid-support/privacy">Privacy</a>
        </nav>
      </header>
      <section><h2>Player resources</h2><p>Use the links above to read the privacy policy or contact support.</p></section>
      <footer>Space Raid: Trace Protocol · PARK JUNSANG</footer>
    </main>
  </body>
</html>
